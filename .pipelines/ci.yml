trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self

          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'

          # Install Rust toolchain with ARM64 target
          - task: PowerShell@2
            displayName: Install Rust toolchain
            inputs:
              targetType: inline
              script: |
                Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
                .\rustup-init.exe -y --default-toolchain stable --target aarch64-pc-windows-msvc
                $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
                echo "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
                rustc --version
                cargo --version

          # Authenticate with Azure Artifacts Cargo feed
          - task: NuGetAuthenticate@1
            displayName: Authenticate Cargo feed

          # Core library tests
          - task: PowerShell@2
            displayName: Test core library
            inputs:
              targetType: inline
              script: cargo test -p dynwinrt

          # winrt-meta tests
          - task: PowerShell@2
            displayName: Test winrt-meta
            inputs:
              targetType: inline
              script: cargo test -p winrt-meta

          # Build winrt-meta (x64 + arm64)
          - task: PowerShell@2
            displayName: Build winrt-meta (x64)
            inputs:
              targetType: inline
              script: cargo build -p winrt-meta --release

          - task: PowerShell@2
            displayName: Build winrt-meta (arm64)
            inputs:
              targetType: inline
              script: cargo build -p winrt-meta --release --target aarch64-pc-windows-msvc

          # Build dynwinrt-js (x64 + arm64)
          - task: PowerShell@2
            displayName: Install JS binding dependencies
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npm install

          - task: PowerShell@2
            displayName: Build dynwinrt-js (x64)
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npx napi build --no-const-enum --platform --release -o dist

          - task: PowerShell@2
            displayName: Build dynwinrt-js (arm64)
            inputs:
              targetType: inline
              workingDirectory: bindings/js
              script: npx napi build --no-const-enum --platform --release --target aarch64-pc-windows-msvc -o dist
